# Development reverse proxy for embedding external sites in iframes
# Features:
#  - Dynamic upstream via query parameter (?url=)
#  - Strips frame-blocking headers (X-Frame-Options, frame-ancestors in CSP)
#  - Injects permissive frame-ancestors * into CSP
#  - Optional JS injection toggle via ?inject=1 for fetch/XHR rewrite
#  - CORS permissive headers
# NOTE: NGINX cannot easily transform streaming HTML safely for all encodings.
# We implement minimal Lua (if OpenResty) or sub_filter fallback (simple cases).
# This config is written for OpenResty (nginx + lua). If you only have stock nginx
# remove the Lua sections and disable injection.

worker_processes  1;

events { worker_connections 1024; }

http {
  lua_shared_dict inject_cache 10m;
  resolver 1.1.1.1 8.8.8.8 ipv6=off;

  map $http_user_agent $is_headless {
    default 0;
    ~*curl 1;
  }

  server {
    listen 8080;
    server_name localhost;

    # Health
    location /ping { return 200 'ok'; }

    # /proxy?url=https://example.com/path
    location /proxy {
      set $raw_url $arg_url;
      if ($raw_url = '') { return 400 'Missing ?url'; }

      # Validate protocol (basic)
      if ($raw_url !~* '^https?://') { return 400 'Invalid protocol'; }

      # Escape for proxy_pass usage (split host/path)
      set $upstream $raw_url;

      # Extract scheme://host
      if ($raw_url ~* '^(https?://[^/]+)(/.*)?$') {
        set $upstream_host $1;
        set $upstream_path $2;
      }
      if ($upstream_path = '') { set $upstream_path /; }

      proxy_set_header Host $host; # you may prefer $http_host
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Accept-Encoding ""; # disable to allow sub_filter (if used)

      proxy_pass $upstream_host$upstream_path;

      # Timeouts
      proxy_connect_timeout 8s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;

      # Header filtering
      proxy_hide_header X-Frame-Options;
      # We can't easily surgically remove frame-ancestors from CSP; add our own after.

      add_header Content-Security-Policy "frame-ancestors *" always;
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Credentials false always;
      add_header Access-Control-Allow-Methods 'GET,HEAD,OPTIONS' always;
      add_header Access-Control-Allow-Headers * always;

      # Simple HTML injection using sub_filter (only works if not compressed)
      # Enable with ?inject=1
      sub_filter_once off;
      if ($arg_inject = 1) {
        sub_filter '</head>' '\n<script>console.log("[nginx inject] active")</script></head>';
      }
    }
  }
}
